<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Testes</title>
<style>
  body { margin: 0; background: #12181a; color: #dfe6e2; font: 13px/1.6 ui-monospace, monospace; }
  pre { padding: 20px; margin: 0; white-space: pre-wrap; }
</style>
</head>
<body>
<pre id="out">rodando…</pre>

<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/three.module.js",
    "three/addons/": "../vendor/three/addons/"
  }
}
</script>

<script type="module">
import { report } from './assert.js';

// Ordem fixa pra saída ser comparável entre execuções.
const SUITES = ['aim', 'compass', 'movement', 'camera', 'jump', 'stance', 'terrain', 'chao', 'textura', 'floresta', 'swim', 'inclinacao', 'model', 'drop', 'melee', 'firearm', 'ballistics', 'muzzle', 'slope', 'combate', 'digging', 'settling', 'lote', 'indice', 'construcoes', 'impacto', 'fagulha', 'dominacao', 'hitfeed', 'avisodano', 'ragdoll', 'rig', 'porte', 'passada', 'postura', 'espolio', 'bot', 'pelotao', 'suprimento', 'tratamento', 'mapa', 'sinalizacao', 'depuracao', 'ferramentas', 'folego', 'treino', 'dano', 'corpo', 'bracos', 'telemetro', 'jipe', 'grade', 'horizonte', 'flow'];

const problems = [];

// Todos os módulos são buscados ANTES de qualquer suíte rodar.
//
// Importar no meio do laço intercalava rede com trabalho pesado de CPU, e sob
// `--virtual-time-budget` isso derrubava uma importação por rodada, sempre
// numa suíte diferente: "Failed to fetch dynamically imported module", com o
// mesmo arquivo respondendo 200 no curl logo depois. Buscando tudo no começo,
// a rede acontece enquanto a página ainda não tem o que fazer.
//
// E os ASSETS vão junto, pelo mesmo motivo e com o mesmo sintoma.
//
// Os `.glb` continuavam sendo buscados lá no meio, por quem precisasse deles:
// medido, o do jipe respondia "Failed to fetch" com a suíte inteira rodando e
// carregava sem falha nenhuma com a suíte dele sozinha. O erro caía dez
// asserções adiante, num teste que fala de volante e mão, e não de rede.
// Buscá-los aqui é a mesma ideia dos módulos — a rede acontece enquanto a
// página ainda não tem o que fazer.
//
// As falhas são ENGOLIDAS: quem roda sem os arquivos continua rodando, e cada
// suíte que depende de um já sabe se virar sem ele (`soldadoPronto`,
// `jipePronto`). Quem chamar o carregador depois recebe a mesma promessa.
const assets = [
  ['soldado', () => import('../src/bots/model.js').then((m) => m.carregarSoldado())],
  ['jipe', () => import('../src/veiculos/modelo.js').then((m) => m.carregarJipe())]
];

const modulos = await Promise.all([
  ...SUITES.map(
    (name) => import(`./suites/${name}.js`)
      .then((module) => ({ name, module }))
      .catch((error) => ({ name, error }))
  ),
  ...assets.map(([nome, carregar]) => carregar().catch((erro) => {
    problems.push(`AVISO  asset "${nome}" não carregou: ${erro.message}`);
    return null;
  }))
]).then((tudo) => tudo.slice(0, SUITES.length));

for (const { name, module, error } of modulos) {
  if (error) {
    problems.push(`FALHA  suite "${name}" não carregou: ${error.message}`);
    console.error(error);
    continue;
  }
  try {
    await module.run();
  } catch (erro) {
    problems.push(`FALHA  suite "${name}" estourou: ${erro.message}`);
    console.error(erro);
  }
}

const body = report();
const tail = problems.length ? '\n' + problems.join('\n') + '\nHOUVE FALHA' : '';
document.getElementById('out').textContent = body + tail;
</script>
</body>
</html>
