<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Modelos</title>
<style>
  body { margin: 0; background: #3a4a52; font: 12px/1.5 ui-monospace, monospace; color: #fff; }
  #out { position: fixed; top: 0; left: 0; padding: 8px 10px; background: #000a; white-space: pre; }
  a { color: #9fe08a; }
</style>
</head>
<body>
<pre id="out">carregando…</pre>

<script type="importmap">
{
  "imports": {
    "three": "../vendor/three/three.module.js",
    "three/addons/": "../vendor/three/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FACTORIES } from '../src/items/models.js';

// ?item=m1911 escolhe o modelo; sem parâmetro, mostra o primeiro
const nomes = Object.keys(FACTORIES);
const escolhido = new URLSearchParams(location.search).get('item') || nomes[0];
const criar = FACTORIES[escolhido];

const W = 1200, H = 800;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W / 2, H / 2);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a4a52);
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x30302c, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(0.5, 0.9, 0.7);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 0.9);
rim.position.set(-0.7, 0.2, -0.6);
scene.add(rim);

const model = criar();
scene.add(model);

const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
const span = Math.max(size.x, size.y, size.z);

let tris = 0;
model.traverse((o) => {
  if (!o.geometry) return;
  const p = o.geometry.attributes.position;
  tris += o.geometry.index ? o.geometry.index.count / 3 : p.count / 3;
});

const vistas = [
  { nome: 'lateral', dir: [1, 0.25, 0.15] },
  { nome: 'frente (mira)', dir: [0, 0.02, 1] },
  { nome: 'de cima', dir: [0.05, 1, 0.05] },
  { nome: 'traseira', dir: [-0.15, 0.2, -1] }
];

const out = document.createElement('canvas');
out.width = W;
out.height = H;
const ctx = out.getContext('2d');
const camera = new THREE.PerspectiveCamera(28, (W / 2) / (H / 2), 0.001, 20);

vistas.forEach((vista, i) => {
  const dir = new THREE.Vector3(...vista.dir).normalize();
  camera.position.copy(center).addScaledVector(dir, span * 2.6);
  camera.lookAt(center);
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);

  const x = (i % 2) * (W / 2);
  const y = Math.floor(i / 2) * (H / 2);
  ctx.drawImage(renderer.domElement, x, y);
  ctx.fillStyle = '#000b';
  ctx.fillRect(x, y, 170, 24);
  ctx.fillStyle = '#fff';
  ctx.font = '15px ui-monospace, monospace';
  ctx.fillText(vista.nome, x + 8, y + 17);
});

document.body.replaceChild(out, renderer.domElement);
document.getElementById('out').textContent = [
  `item: ${escolhido}   (${nomes.join(' · ')})`,
  `triângulos: ${tris}`,
  `tamanho: ${(size.x * 1000).toFixed(0)} x ${(size.y * 1000).toFixed(0)} x ${(size.z * 1000).toFixed(0)} mm`
].join('\n');
</script>
</body>
</html>
