<html lang="pt-br">
<head><meta charset="utf-8"><title>Bancada: colisão</title>

</head>
<body>
<pre id="out">medindo…</pre>
<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { collides, groundHeightAt, ceilingAbove } from '../src/player/collision.js';
import { ListaDeColisores } from '../src/world/colisores.js';

/**
 * Quanto custa varrer a lista de colisores, em tempo REAL.
 *
 * Não é suíte: sob --virtual-time-budget o performance.now() não anda, e uma
 * asserção de milissegundo passa verde com 0,000 ms sem exercitar nada. Esta
 * página abre no navegador de verdade e conta voltas FIXAS — laço por relógio
 * sob tempo virtual já travou uma bancada aqui sem sair erro nenhum.
 */
const VOLTAS = 400;          // quadros simulados por medida
const POR_QUADRO = 40;       // ~4 varreduras por corpo, 10 corpos vivos

function lista(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const x = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 1900 - 950;
    const z = (Math.sin(i * 78.233) * 43758.5453 % 1) * 1900 - 950;
    const y = 20 + (i % 7);
    out.push({
      box: new THREE.Box3(
        new THREE.Vector3(x - 0.3, y, z - 0.3),
        new THREE.Vector3(x + 0.3, y + 8, z + 0.3)),
      standable: i % 4 === 0
    });
  }
  return out;
}

function medir(colisores) {
  const t0 = performance.now();
  let toca = 0;
  for (let q = 0; q < VOLTAS; q++) {
    for (let c = 0; c < POR_QUADRO; c++) {
      const x = ((q * 37 + c * 91) % 1900) - 950;
      const z = ((q * 53 + c * 17) % 1900) - 950;
      if (collides(colisores, x, z, 20, 1.7)) toca++;
      groundHeightAt(colisores, x, z, 20, 20);
      ceilingAbove(colisores, x, z, 20, 21.7, 22.3);
    }
  }
  const total = performance.now() - t0;
  return { porQuadro: total / VOLTAS, toca };
}

function indexada(n) {
  const l = new ListaDeColisores();
  l.push(...lista(n));
  return l;
}

const linhas = ['colisores → custo por QUADRO (40 varreduras, 3 funções cada)',
  '', '            varredura linear      com índice espacial', ''];
for (const n of [500, 1000, 2000, 4000, 8000, 16000]) {
  const cru = lista(n);
  const idx = indexada(n);
  medir(cru); medir(idx);                  // aquece o JIT antes de cronometrar
  const a = medir(cru).porQuadro;
  const b = medir(idx).porQuadro;
  const pct = (v) => `${((100 * v) / (1000 / 60)).toFixed(1)}%`;
  linhas.push(`${String(n).padStart(6)}    ${a.toFixed(3)} ms (${pct(a)})`
    + `      ${b.toFixed(3)} ms (${pct(b)})     ${(a / b).toFixed(0)}x`);
}
document.getElementById('out').textContent = linhas.join('\n');
</script>
</body>
</html>
