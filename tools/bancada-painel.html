<script type="module">
import { initAjustes } from '../src/ui/ajustes.js';
import { GRADE, SPREAD, BULLET, MELEE, VIEW, CAMERA, STAMINA, SWAP, PLAYER } from '../src/config.js';

// O painel montado com o config DE VERDADE, fora do jogo: o que se procura é
// geometria de layout, e um mapa inteiro atrás só atrapalha a leitura.
const linhas = [];
const diz = (s) => { linhas.push(s); document.getElementById('out').textContent = linhas.join('\n'); console.log(s); };

const ajustes = initAjustes(
  { GRADE, SPREAD, BULLET, MELEE, VIEW, CAMERA, STAMINA, SWAP, PLAYER },
  { soltarMouse: () => {} }
);
ajustes.alternar(true);

diz(`controles montados             ${ajustes.controles.length}`);

const caixa = document.getElementById('ajustes');
const r = caixa.getBoundingClientRect();
diz(`#ajustes                       ${r.width.toFixed(0)} x ${r.height.toFixed(0)} em (${r.left.toFixed(0)}, ${r.top.toFixed(0)})`);
diz(`janela                         ${innerWidth} x ${innerHeight}`);

// Quem passa da janela é quem está estourando o layout — e a cor de fundo
// computada diz QUEM pintou, que é a pergunta que a foto deixou em aberto.
diz('');
diz('elementos grandes dentro do painel');
for (const el of caixa.querySelectorAll('*')) {
  const b = el.getBoundingClientRect();
  if (b.height < 150 && b.width < 300) continue;
  const s = getComputedStyle(el);
  diz(`  ${el.className || el.tagName}`.padEnd(34) +
    `${b.width.toFixed(0)}x${b.height.toFixed(0)} · fundo ${s.backgroundColor} · overflow ${s.overflowY}`);
}

diz('');
diz(`o painel cabe na janela?       ${r.bottom <= innerHeight ? 'sim' : `NÃO, passa ${(r.bottom - innerHeight).toFixed(0)} px`}`);
diz('FIM');
</script></body></html>
